<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a07">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>body{margin:0}</style></head><body>
<title>PN MANCY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* ثيم داكن ثابت بأخضر الترمنال: ترحيب، فهرس، درس، اختبار */
:root{color-scheme:dark;--bg:#050a07;--card:rgba(11,24,16,.84);--fg:#e6f5ea;--mute:#9dbfa8;--green:#00ff66;--ink:#02140a;--line:#1d4a2d;--code:rgba(0,0,0,.82);--codefg:#8dffb4;--bad:#ff6b6b}
body{background:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,sans-serif;font-size:16px;line-height:1.8}
#app{direction:rtl;max-width:680px;margin:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.5}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.11;z-index:0}
#app{position:relative;z-index:1}
.mute{color:var(--mute)}
.brand{display:flex;align-items:center;gap:12px;direction:ltr;justify-content:flex-end}
.brand svg{width:52px;height:52px;flex:none}
.brand b{font:700 1.6rem 'JetBrains Mono',monospace;color:var(--green)}
#bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 16px}
#bar i{display:block;height:100%;background:var(--green)}
#q{box-sizing:border-box;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
h2{margin-top:24px;color:var(--green)}
.item{display:flex;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:8px}
.item span:first-child{min-width:2em;color:var(--green);font-weight:800}
.row,.quiz{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:10px}
.row pre{margin:0;background:var(--code);color:var(--codefg);direction:ltr;text-align:left;padding:8px 12px;overflow-x:auto;font:14px/1.7 'JetBrains Mono',monospace}
.row p{margin:0;padding:6px 12px}
.btn{background:var(--green);color:var(--ink);border:1px solid var(--green);border-radius:8px;padding:6px 16px;font-weight:800}
.btn:hover{box-shadow:0 0 16px rgba(var(--rgb),.55)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:20px}
.testbox{border:1px dashed var(--green);background:var(--card);border-radius:8px;padding:16px;margin-top:20px;text-align:center}
.testbox .btn{width:100%;padding:10px}
.quiz{border:1px solid var(--line);padding:12px;margin:12px 0 0;min-width:0}
.quiz h3{font-size:1rem;margin-bottom:8px}
.opt{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer}
.opt input{accent-color:var(--green);flex:none}
.quiz.ok{border-color:var(--green)}.quiz.no{border-color:var(--bad)}
.verdict{font-weight:800;margin:8px 0 0}.ok .verdict{color:var(--green)}.no .verdict{color:var(--bad)}
.result{font-weight:800;text-align:center;min-height:1.8em}
/* ظهور بالترتيب */
.in{animation:in .45s ease both;animation-delay:calc(var(--n)*70ms)}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.tools .btn{flex:1}
summary{cursor:pointer;color:var(--green);font-weight:800}
.field{box-sizing:border-box;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
#cert{width:100%;height:auto;margin-bottom:10px}
.screen{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px;box-shadow:0 0 18px rgba(var(--rgb),.18)}
.dots{font:12px 'JetBrains Mono',monospace;color:var(--mute);border-bottom:1px solid var(--line);padding:4px 10px;text-align:left}
#pcode{height:210px;overflow:auto;padding:8px 0;font:14px/1.8 'JetBrains Mono',Cairo,Tahoma,monospace;color:var(--codefg);text-align:left}
.ln{white-space:pre;padding:0 12px;width:max-content;min-width:100%;box-sizing:border-box;opacity:.5;min-height:1.8em}
.ln.on{opacity:1;background:rgba(var(--rgb),.16);box-shadow:inset 3px 0 0 var(--green)}
#pterm{margin:0;height:130px;overflow:auto;padding:8px 12px;font:13px/1.7 'JetBrains Mono',Cairo,Tahoma,monospace;color:#fff;text-align:left;white-space:pre-wrap;unicode-bidi:plaintext}
#pterm.wait{opacity:.35}
#psay{margin:0;min-height:3.6em}
.pctl .btn{padding:8px 2px;font-size:13px;white-space:nowrap}
#pbar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 10px}#pbar i{display:block;height:100%;background:var(--green);transition:width .3s}
#app{padding-bottom:100px!important}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;direction:rtl;justify-content:center;background:rgba(3,9,5,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;max-width:130px;background:none;border:0;border-radius:10px;color:var(--mute);padding:2px;font-size:12px;line-height:1.5}
#nav i{display:block;font-style:normal;font-size:20px}
#nav button.on{color:var(--green);background:rgba(var(--rgb),.12);box-shadow:0 0 12px rgba(var(--rgb),.25)}
#ring{position:relative;width:min(230px,68vw);aspect-ratio:1;margin:10px auto}
#ring svg{width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(var(--rgb),.5))}
#ring .track{fill:none;stroke:var(--line);stroke-width:12}
#ring .arc{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}
#ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ring b{font:700 2.4rem 'JetBrains Mono',monospace;color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px}
.stat i{font-style:normal;display:block}.stat b{display:block;font-size:1.4rem;color:var(--green)}.stat span{font-size:12px;color:var(--mute)}
#resume{width:100%;padding:12px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--green);border-radius:14px;padding:14px 6px;text-align:center;box-shadow:0 0 14px rgba(var(--rgb),.22)}
.card i{display:block;font-style:normal;font-size:30px}.card b{display:block;color:var(--green)}.card small{color:var(--mute)}
.card:active{box-shadow:0 0 24px rgba(var(--rgb),.6)}
#map{padding-top:4px}
.stop{--x:0;position:relative;display:flex;align-items:center;gap:12px;width:calc(100% - 96px);margin:0 0 22px;margin-inline-start:calc(var(--x)*48px);background:none;border:0;padding:0;text-align:right}
.stop:not(:last-child)::after{content:'';position:absolute;right:26px;top:56px;height:18px;border-right:3px dashed var(--line)}
.stop.done::after{border-color:var(--green)}
.dot{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#07130c;border:3px solid var(--line);font-weight:800;color:var(--mute)}
.done .dot{background:var(--green);border-color:var(--green);color:var(--ink);box-shadow:0 0 16px rgba(var(--rgb),.7)}
.now .dot{border-color:var(--green);font-size:24px;animation:beat 1.4s ease-in-out infinite}
.stop .name{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;line-height:1.5}
.now .name{border-color:var(--green)}
@keyframes beat{50%{transform:scale(1.12);box-shadow:0 0 22px var(--green)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:16;background:var(--green);color:var(--ink);font-weight:800;border-radius:30px;padding:8px 22px;white-space:nowrap;direction:rtl;animation:toast 2.6s ease both}
@keyframes toast{0%{opacity:0;margin-top:-30px}15%,80%{opacity:1;margin-top:0}100%{opacity:0}}
#levelup{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;direction:rtl;text-align:center;padding:24px}
#levelup b{font:700 clamp(2.4rem,13vw,4rem) 'JetBrains Mono',monospace;color:var(--green);text-shadow:0 0 28px var(--green);animation:pop2 .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop2{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}

:root{--rgb:0,255,102}
:root[data-skin=blue]{--rgb:42,190,255;--green:#2abeff;--line:#17435c;--card:rgba(9,22,34,.86);--codefg:#a6e2ff;--mute:#9db4c6;--bg:#04080d;--ink:#02101a}
:root[data-skin=purple]{--rgb:190,120,255;--green:#be78ff;--line:#43275e;--card:rgba(21,12,31,.86);--codefg:#dcbcff;--mute:#b6a6c6;--bg:#08050c;--ink:#12051f}
:root[data-skin=red]{--rgb:255,77,94;--green:#ff4d5e;--line:#5e222a;--card:rgba(31,11,14,.86);--codefg:#ffbac0;--mute:#c6a5a9;--bg:#0c0405;--ink:#1c0306;--bad:#ffd23f}
#bg [stroke="#00ff66"],.brand svg [stroke="#00ff66"]{stroke:var(--green)}
#bg [fill="#00ff66"],.brand svg [fill="#00ff66"]{fill:var(--green)}
#rain{position:fixed;inset:0;pointer-events:none;opacity:.16;z-index:0}
#map{position:relative}#map .snake{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible}
.snake path{fill:none;stroke:var(--line);stroke-width:13;stroke-linecap:round}
.snake path.lit{stroke:var(--green);filter:drop-shadow(0 0 6px var(--green))}
.stop{z-index:1}.stop:not(:last-child)::after{display:none}#map h2{position:relative;z-index:1;width:max-content;max-width:100%;background:var(--bg);border-radius:8px;padding:0 10px;margin-bottom:14px}
.row pre{direction:ltr}.row pre.typing::after{content:'▋';color:var(--green)}
.t-k{color:#ff7ac6;font-weight:700}.t-s{color:#ffe27a}.t-n{color:#ffa45c}.t-f{color:#6fd8ff}.t-c{color:#8a9a90;font-style:italic}
#showall{width:100%;margin-top:10px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px}
.badge i{font-style:normal;font-size:34px;filter:grayscale(1);opacity:.35}.badge small{color:var(--mute)}
.badge.open{border-color:var(--green);box-shadow:0 0 16px rgba(var(--rgb),.45)}.badge.open i{filter:none;opacity:1}
.swatch{flex:1;min-width:40%;border-radius:10px;padding:10px;border:2px solid transparent;color:#04100a;font-weight:800}
.swatch.green{background:#00ff66}.swatch.blue{background:#2abeff}.swatch.purple{background:#be78ff}.swatch.red{background:#ff4d5e}.swatch.on{border-color:#fff}
/* المقدمة */
#intro{position:fixed;inset:0;background:#000;z-index:20;transition:opacity .6s;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#intro canvas{display:block;width:100%;height:100%}
.cyber{display:flex;align-items:center;gap:12px;box-sizing:border-box;width:100%;margin:0 0 14px;padding:12px;background:var(--card);border:1px solid var(--green);border-radius:8px;color:var(--fg);text-decoration:none;box-shadow:0 0 14px rgba(var(--rgb),.25)}
.cyber i{font-style:normal;font-size:30px}.cyber b{display:block;color:var(--green);font-family:'JetBrains Mono',monospace}.cyber small{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>

/* أزرار الرجوع القديمة: توجه للمكان المناسب */

/* الاحتفال */
function confetti(){
 if(calm())return;
 const c=el('canvas',{className:'confetti',width:innerWidth,height:innerHeight}),x=c.getContext('2d');document.body.append(c);
 const bits=Array.from({length:90},()=>({x:c.width/2,y:c.height*.55,vx:(Math.random()-.5)*11,vy:-4-Math.random()*11,s:3+Math.random()*6,k:['#00ff66','#00f2bf','#ffffff','#ffd23f'][Math.random()*4|0]}));
 let n=0;const frame=()=>{x.clearRect(0,0,c.width,c.height);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.35;x.fillStyle=b.k;x.fillRect(b.x,b.y,b.s,b.s)});if(++n<100)requestAnimationFrame(frame);else c.remove()};
 requestAnimationFrame(frame);setTimeout(()=>c.remove(),4000)}
function toast(text){document.querySelector('.toast')?.remove();const t=el('div',{className:'toast',role:'status',textContent:text});document.body.append(t);setTimeout(()=>t.remove(),2600)}
const rank=p=>p>=250?3:p>=150?2:p>=60?1:0;

 const now=rank(points()),seen=read('rank',null);
 if(seen===null){write('rank',now);return}
 if(now<=seen)return;
 write('rank',now);confetti();
 const box=el('div',{id:'levelup',role:'dialog'},el('b',{textContent:'LEVEL UP',dir:'ltr'}),el('p',{textContent:`وصلت لمستوى ${level(points())}`}));

const baseQuiz=quiz;
quiz=function(i){
 stopPlayer();tab('map');const had=done.includes(i);baseQuiz(i);
 document.getElementById('check').addEventListener('click',()=>{
  if(!app.querySelector('.result').textContent.includes('برافو'))return;
  confetti();if(!had){toast('+10 نقاط ⭐');levelCheck()}})};

/* --- التعبان: مسار منور يمر بكل محطات الخريطة --- */
function drawSnake(){
 const box=document.getElementById('map');if(!box)return;
 box.querySelector('.snake')?.remove();
 const stops=[...box.querySelectorAll('.stop')];if(stops.length<2)return;
 const base=box.getBoundingClientRect();
 const pts=stops.map(s=>{const r=s.querySelector('.dot').getBoundingClientRect();return{x:s.offsetLeft+s.querySelector('.dot').offsetLeft+28,y:s.offsetTop+s.querySelector('.dot').offsetTop+28,done:s.classList.contains('done')}});
 const s=svg('svg',{class:'snake',width:box.clientWidth,height:box.scrollHeight,'aria-hidden':'true'});
 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],m=(a.y+b.y)/2;
  s.append(svg('path',{d:`M${a.x} ${a.y}C${a.x} ${m} ${b.x} ${m} ${b.x} ${b.y}`,class:a.done?'lit':''}))}
 box.prepend(s)}

/* --- خلفية Matrix هادية في الرئيسية فقط --- */
const rain=el('canvas',{id:'rain'});rain.setAttribute('aria-hidden','true');document.body.prepend(rain);
let drops=[];
function sizeRain(){rain.width=innerWidth;rain.height=innerHeight;drops=Array.from({length:Math.ceil(innerWidth/22)},()=>Math.random()*innerHeight/18|0)}
addEventListener('resize',sizeRain);sizeRain();
const themeColor=()=>getComputedStyle(document.documentElement).getPropertyValue('--green').trim()||'#00ff66';
setInterval(()=>{
 const on=!!document.getElementById('ring')&&!document.getElementById('intro')&&!document.hidden&&!calm();
 rain.hidden=!on;if(!on)return;
 const x=rain.getContext('2d');
 x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,rain.width,rain.height);
 x.globalCompositeOperation='source-over';x.fillStyle=themeColor();x.font='14px monospace';
 drops.forEach((y,i)=>{x.fillText('01<>{}#='[Math.random()*8|0],i*22,y*18);drops[i]=y*18>rain.height&&Math.random()>.96?0:y+1})},110);

/* --- صوت واهتزاز --- */
let sound=read('sound',true),audio=null;
function feedback(good){
 if(!sound)return;
 try{
  audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();
  (good?[660,880]:[220,170]).forEach((f,n)=>{const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+n*.1;o.type=good?'sine':'triangle';o.frequency.value=f;v.gain.setValueAtTime(.08,t);v.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(v).connect(audio.destination);o.start(t);o.stop(t+.15)})
 }catch(e){}
 try{navigator.vibrate?.(good?35:[60,40,60])}catch(e){}}
/* النتيجة تظهر في .result: نقرأها بعد كل ضغطة */
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const isCheck=b.id==='check',isAnswer=/آمنة|مشبوهة/.test(b.textContent);
 if(!isCheck&&!isAnswer)return;
 setTimeout(()=>{const t=app.querySelector('.result')?.textContent||'';
  if(isAnswer)feedback(t.startsWith('✓'));else if(t.startsWith('نتيجتك'))feedback(t.includes('برافو'))},0)},true);

/* --- تلوين كود بايثون (بعناصر نصية فقط) --- */
const TOKENS=/(#.*$)|([fr]?"(?:\\.|[^"\\])*"|[fr]?'(?:\\.|[^'\\])*')|\b(False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|not|or|pass|raise|return|try|while|with|yield)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
function paint(node,code){
 const out=[];let at=0;
 for(const m of code.matchAll(TOKENS)){out.push(code.slice(at,m.index));const kind=m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'n':'f';out.push(el('span',{className:'t-'+kind,textContent:m[0]}));at=m.index+m[0].length}
 out.push(code.slice(at));node.replaceChildren(...out)}
/* الكود يتكتب لوحده في صفحة الدرس */
let lessonTyping=null;
function typeLesson(i){
 clearInterval(lessonTyping);
 const pres=[...app.querySelectorAll('.row pre')],codes=D[i].r.map(r=>r[0]);
 if(!pres.length)return;
 let row=0,pos=0,all=null;
 const finish=()=>{clearInterval(lessonTyping);pres.forEach((p,n)=>{paint(p,codes[n]);p.classList.remove('typing')});all?.remove()};
 if(calm()){finish();return}
 all=btn('⏩ اعرض الكود كله',finish);all.id='showall';
 app.querySelector('.row').before(all);
 pres.forEach((p,n)=>{p.style.boxSizing='border-box';p.style.minHeight=p.offsetHeight+'px';p.textContent=''});
 lessonTyping=setInterval(()=>{
  const p=pres[row];if(!p.isConnected){clearInterval(lessonTyping);return}
  pos+=2;p.classList.add('typing');p.textContent=codes[row].slice(0,pos);
  if(pos>=codes[row].length){paint(p,codes[row]);p.classList.remove('typing');row++;pos=0;if(row===pres.length)finish()}},35)}
const showBeforeType=show;
show=function(i){showBeforeType(i);typeLesson(i)};
/* تلوين سطور المشغّل بعد اكتمال كتابتها */
new MutationObserver(()=>{document.querySelectorAll('#pcode .ln').forEach((n,k)=>{
 const title=app.querySelector('h2')?.textContent||'';const lesson=D.find(x=>title==='🎬 شرح: '+x.t);
 if(lesson&&n.textContent===lesson.r[k][0]&&!n.querySelector('span'))paint(n,lesson.r[k][0])})}).observe(app,{childList:true,subtree:true});

/* --- الأوسمة --- */
let topRun=read('topStreak',0),watched=read('watched',false),cyberSeen=read('cyber',false);
const keepStreak=()=>{if(days()>topRun){topRun=days();write('topStreak',topRun)}};
const BADGES=[
 ['🌱','أول خطوة','انجح في أول اختبار',()=>passedCount()>=1],
 ['📘','خمسة على التوالي','انجح في 5 اختبارات',()=>passedCount()>=5],
 ['🚀','نص الطريق','انجح في 13 اختبار',()=>passedCount()>=13],
 ['🏆','ختمت الرحلة','انجح في كل الاختبارات',finished],
 ['🎯','صياد الخدع','10 من 10 في اكشف الخدعة',()=>best>=CASES.length],
 ['🔥','7 أيام متتالية','ادخل دروس 7 أيام ورا بعض',()=>topRun>=7],
 ['🎬','متفرج ذكي','افتح شرح متحرك',()=>watched],
 ['⭐','جامع المفضلة','ضيف 3 دروس للمفضلة',()=>favs.length>=3],
 ['🛡️','حارس سيبراني','افتح قسم Y-CYBER',()=>cyberSeen]];
function badges(){
 stopPlayer();tab('me');keepStreak();
 const got=BADGES.filter(b=>b[3]()).length;
 app.replaceChildren(btn('رجوع لحسابي',()=>profile()),el('h2',{textContent:`🏅 الأوسمة (${got} من ${BADGES.length})`}),
  el('div',{className:'badges'},...BADGES.map(([icon,name,how,has])=>el('div',{className:'badge'+(has()?' open':'')},el('i',{textContent:icon}),el('b',{textContent:name}),el('small',{textContent:how}),el('small',{textContent:has()?'مفتوح ✓':'مقفول 🔒'})))));scrollTo(0,0)}
const playerBase=player;
player=function(i){clearInterval(lessonTyping);if(!watched){watched=true;write('watched',true)}playerBase(i)};
app.addEventListener('click',e=>{if(e.target.closest('#c-cyber')){cyberSeen=true;write('cyber',true)}},true);
navBar.querySelector('[data-tab=cyber]').addEventListener('click',()=>{cyberSeen=true;write('cyber',true)},true);

/* --- الثيمات --- */
const THEMES={green:'أخضر هاكر',blue:'أزرق Cyber',purple:'بنفسجي',red:'أحمر'};
let theme=read('theme','green');if(!THEMES[theme])theme='green';
function applyTheme(name){theme=name;write('theme',name);document.documentElement.dataset.skin=name;document.querySelector('meta[name=theme-color]')?.setAttribute('content','#050a07')}
applyTheme(theme);
const profileBase=profile;
profile=function(){
 profileBase();keepStreak();
 const picks=el('div',{className:'tools themes'},...Object.entries(THEMES).map(([id,name])=>{const b=el('button',{type:'button',className:'swatch '+id+(id===theme?' on':''),textContent:(id===theme?'✓ ':'')+name,onclick:()=>{applyTheme(id);profile()}});return b}));
 const snd=btn(sound?'🔊 الصوت والاهتزاز: شغال':'🔇 الصوت والاهتزاز: مقفول',()=>{sound=!sound;write('sound',sound);profile();feedback(true)});snd.id='snd';
 app.querySelector('.tools').append(btn('🏅 الأوسمة',badges));
 app.querySelector('.tools').after(el('h2',{textContent:'🎨 الثيم'}),picks,el('div',{className:'tools'},snd))};

if(location.hash==='#home'){document.getElementById('intro').remove();history.replaceState(null,'',location.pathname)}

<script>
if(document.getElementById('intro')){
/* المقدمة السينمائية: Matrix + جزيئات + درع + آلة كاتبة عربية. */
'use strict';
(() => {
  const box = document.getElementById('intro'), cv = box.querySelector('canvas'), x = cv.getContext('2d');
  const DURATION = 6.5, MESSAGE = 'يوسف المنسي بيحبك', CHARS = '0123456789ABCDEF#$%&<>*+=@';
  let W, H, drops = [], start, done = false, frame;
  const dots = Array.from({ length: 40 }, () => [Math.random(), Math.random(), .02 + Math.random() * .05, 1 + Math.random() * 1.8]);
  const ease = v => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
  const pick = () => CHARS[Math.random() * CHARS.length | 0];

  function resize() {
    const r = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; x.setTransform(r, 0, 0, r, 0, 0);
    drops = Array.from({ length: Math.ceil(W / 18) }, () => ({ y: Math.random() * H, v: 80 + Math.random() * 220, s: Array.from({ length: 6 + (Math.random() * 10 | 0) }, pick) }));
  }
  function text(t, cx, cy, font, color, alpha, glow, rtl) {
    x.save(); x.globalAlpha = alpha; x.font = font; x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.direction = rtl ? 'rtl' : 'ltr'; x.shadowColor = color; x.shadowBlur = glow || 0; x.fillText(t, cx, cy); x.restore();
  }
  function shield(cx, cy, s, a, pulse) {
    if (a <= 0) return;
    const p = [[0,-.55],[.45,-.38],[.42,.08],[.27,.34],[0,.55],[-.27,.34],[-.42,.08],[-.45,-.38]];
    x.save(); x.globalAlpha = a; x.strokeStyle = '#39ff14'; x.lineWidth = 3; x.shadowColor = '#39ff14'; x.shadowBlur = 26 * pulse;
    x.beginPath(); p.forEach(([px, py], i) => x[i ? 'lineTo' : 'moveTo'](cx + px * s, cy + py * s)); x.closePath();
    x.fillStyle = 'rgba(0,30,8,.85)'; x.fill(); x.stroke(); x.restore();
    text('PN', cx, cy, `800 ${s * .4}px monospace`, '#39ff14', a, 22 * pulse);
  }
  let last = 0;
  function draw(now) {
    if (done) return;
    start ??= now; const t = (now - start) / 1000, dt = Math.min((now - (last || now)) / 1000, .1); last = now;
    const u = Math.min(W, H * .6), pulse = .75 + .25 * Math.sin(t * 4);
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
    const rain = ease(t / .5) * (1 - .65 * ease((t - 1.2) / 1.2));
    x.font = '14px monospace'; x.textAlign = 'center';
    drops.forEach((d, i) => {
      d.y += d.v * dt; if (d.y - d.s.length * 18 > H) d.y = -Math.random() * H * .4;
      if (Math.random() < .12) d.s[Math.random() * d.s.length | 0] = pick();
      d.s.forEach((c, j) => { x.globalAlpha = (1 - j / d.s.length) * rain; x.fillStyle = j ? '#39ff14' : '#dfffe0'; x.fillText(c, i * 18 + 9, d.y - j * 18); });
    });
    x.fillStyle = '#00f2bf'; x.globalAlpha = .6 * ease(t - .8);
    dots.forEach(p => { p[1] = (p[1] - p[2] * dt + 1) % 1; x.beginPath(); x.arc(p[0] * W, p[1] * H, p[3], 0, 7); x.fill(); });
    x.globalAlpha = 1;
    shield(W / 2, H * .30, u * .42, ease((t - .8) / 1.5), pulse);
    const na = ease((t - 2) / .9);
    text('PN MANCY', W / 2, H * .55, `800 ${u * .13}px monospace`, '#39ff14', na, 24 * pulse);
    if (na > .9) { const bw = u * .62; x.fillStyle = '#dfffe0'; x.fillRect(W / 2 - bw / 2 + (t * .7 % 1) * bw * .75, H * .55 + u * .085, bw * .25, 2); }
    text('PYTHON + CYBERSECURITY', W / 2, H * .635, `${u * .043}px monospace`, '#00f2bf', ease((t - 2.6) / .8));
    const n = Math.floor(Math.max(0, Math.min(1, (t - 3.2) / 1.9)) * MESSAGE.length);
    if (n) {
      const font = `700 ${u * .072}px system-ui, "Noto Sans Arabic", Tahoma, sans-serif`;
      x.font = font; const full = x.measureText(MESSAGE + ' ❤️').width, right = W / 2 + full / 2;
      const part = MESSAGE.slice(0, n) + (n === MESSAGE.length ? ' ❤️' : '');
      x.save(); x.font = font; x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.shadowColor = '#39ff14'; x.shadowBlur = 16 * pulse;
      x.fillText(part, right, H * .75);
      if (n < MESSAGE.length && (t * 4 | 0) % 2 === 0) x.fillRect(right - x.measureText(part).width - 8, H * .75 - u * .04, 2, u * .08);
      x.restore();
    }
    text('اضغط للتخطي', W / 2, H * .92, '14px system-ui', '#8bb596', ease((t - 1) / .5), 0, true);
    if (t >= DURATION) finish(); else frame = requestAnimationFrame(draw);
  }
  function finish() {
    if (done) return; done = true; cancelAnimationFrame(frame); clearTimeout(guard);
    removeEventListener('resize', resize); box.classList.add('out'); home(); setTimeout(() => box.remove(), 650);
  }
  const opened = performance.now();
  box.addEventListener('click', () => { if (performance.now() - opened > 500) finish(); });
  const guard = setTimeout(finish, (DURATION + 1.5) * 1000);
  addEventListener('resize', resize); resize(); frame = requestAnimationFrame(draw);
})();
}
</script>
