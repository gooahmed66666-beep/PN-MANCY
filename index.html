<title>PN MANCY</title>

<style>
/* ثيم داكن ثابت بأخضر الترمنال: ترحيب، فهرس، درس، اختبار */
:root{color-scheme:dark;--bg:#050a07;--card:rgba(11,24,16,.84);--fg:#e6f5ea;--mute:#9dbfa8;--green:#00ff66;--ink:#02140a;--line:#1d4a2d;--code:rgba(0,0,0,.82);--codefg:#8dffb4;--bad:#ff6b6b}
body{background:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,sans-serif;font-size:16px;line-height:1.8}
#app{direction:rtl;max-width:680px;margin:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.5}
#splash{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;gap:28px;align-items:center;justify-content:center;text-align:center;padding:24px;direction:rtl}
#splash h1{font-size:clamp(1.8rem,8vw,2.8rem);font-weight:800;color:var(--green)}
#splash button{background:var(--green);color:var(--ink);border:0;border-radius:8px;padding:10px 44px;font-weight:800}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.11;z-index:0}
#app{position:relative;z-index:1}
.mute{color:var(--mute)}
.brand{display:flex;align-items:center;gap:12px;direction:ltr;justify-content:flex-end}
.brand svg{width:52px;height:52px;flex:none}
.brand b{font:700 1.6rem 'JetBrains Mono',monospace;color:var(--green)}
#bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 16px}
#bar i{display:block;height:100%;background:var(--green)}
#q{box-sizing:border-box;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
h2{margin-top:24px;color:var(--green)}
.item{display:flex;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:8px}
.item span:first-child{min-width:2em;color:var(--green);font-weight:800}
.row,.quiz{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:10px}
.row pre{margin:0;background:var(--code);color:var(--codefg);direction:ltr;text-align:left;padding:8px 12px;overflow-x:auto;font:14px/1.7 'JetBrains Mono',monospace}
.row p{margin:0;padding:6px 12px}
.btn{background:var(--green);color:var(--ink);border:1px solid var(--green);border-radius:8px;padding:6px 16px;font-weight:800}
.btn:hover{box-shadow:0 0 16px rgba(0,255,102,.55)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:20px}
.testbox{border:1px dashed var(--green);background:var(--card);border-radius:8px;padding:16px;margin-top:20px;text-align:center}
.testbox .btn{width:100%;padding:10px}
.quiz{border:1px solid var(--line);padding:12px;margin:12px 0 0;min-width:0}
.quiz h3{font-size:1rem;margin-bottom:8px}
.opt{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer}
.opt input{accent-color:var(--green);flex:none}
.quiz.ok{border-color:var(--green)}.quiz.no{border-color:var(--bad)}
.verdict{font-weight:800;margin:8px 0 0}.ok .verdict{color:var(--green)}.no .verdict{color:var(--bad)}
.result{font-weight:800;text-align:center;min-height:1.8em}
/* ظهور بالترتيب */
.in{animation:in .45s ease both;animation-delay:calc(var(--n)*70ms)}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* شاشة الترحيب */
#splash svg.logo{width:120px;height:120px;animation:pop .9s cubic-bezier(.2,1.5,.4,1) both}
#splash .name{direction:ltr;font:700 clamp(2rem,10vw,3.2rem) 'JetBrains Mono',monospace;color:var(--green)}
.name span{display:inline-block;white-space:pre;animation:drop .6s cubic-bezier(.2,1.6,.4,1) both,glow 2s ease-in-out 2s infinite;animation-delay:calc(.6s + var(--n)*.1s),2s}
#splash h1{display:flex;flex-wrap:wrap;justify-content:center;gap:.3em}
#splash h1 span{display:inline-block;animation:word .7s ease both;animation-delay:calc(1.7s + var(--n)*.45s)}
#splash .late{animation:in .6s ease 3.2s both}
#splash button{animation:in .6s ease 3.5s both,pulse 1.6s ease 4.2s infinite}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(20deg)}to{opacity:1;transform:none}}
@keyframes word{from{opacity:0;transform:scale(2.2);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes glow{50%{text-shadow:0 0 18px var(--green)}}
@keyframes pulse{50%{box-shadow:0 0 26px var(--green)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
